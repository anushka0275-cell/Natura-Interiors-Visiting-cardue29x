<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natura Interiors - AR Visiting Card</title>

  <!-- A-Frame library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- AR Scene Setup -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    vr-mode-ui="enabled: false">
    
    <!-- Asset Preloading -->
    <a-assets>
      <a-asset-item id="planter-model" src="indoor_planter.glb"></a-asset-item>
    </a-assets>

    <!-- Marker Target setup -->
    <!-- Default set to 'hiro'. For pattern marker replace with: <a-marker type="pattern" url="marker.patt"> -->
    <a-marker preset="hiro">
      <!-- 3D Planter Model -->
      <a-entity 
        gltf-model="#planter-model" 
        position="0 0 0" 
        scale="0.5 0.5 0.5" 
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
      </a-entity>
    </a-marker>

    <!-- Camera Entity -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
