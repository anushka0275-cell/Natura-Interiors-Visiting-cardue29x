<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Natura Interiors - Marker-Based AR Planter</title>

  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- 
    AR.js Scene Setup:
    - displayWidth/displayHeight matching sourceWidth/sourceHeight prevents camera stretch & zoom.
    - matrixCodeType & detectionMode ensure reliable marker tracking.
  -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false">
    
    <!-- Asset Preloading -->
    <a-assets>
      <a-asset-item id="planter-model" src="indoor_planter.glb"></a-asset-item>
    </a-assets>

    <!-- 
      Marker Detection:
      - Uses standard 'hiro' marker pattern.
      - To use your uploaded 'marker.png', create a .patt file using AR.js Marker Training tool 
        and swap preset="hiro" with type="pattern" url="marker.patt".
    -->
    <a-marker preset="hiro">
      <!-- 
        3D Model Entity:
        - scale="1 1 1" renders the GLB at 100% real-world meter scale.
        - If the model is too big/small, adjust scale proportionately (e.g. 0.3 0.3 0.3 for 30% scale).
        - position="0 0 0" anchors the base of the planter directly on top of the physical marker plane.
      -->
      <a-entity 
        gltf-model="#planter-model" 
        position="0 0 0" 
        scale="1 1 1" 
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <!-- Fixed AR Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
